# Build the solution image, smoke-test it on CPU (offline, /data read-only) and stream zac2026_TripleTrouble.tar.gz
# to Google Drive (anyone with the link) for the portal's Test Solution. The link and MD5 go to the run summary.
# Run it from the Actions tab (Docker image -> Run workflow) on main, or push a tag docker-<name> from any commit.
# Secrets: HF_TOKEN (read access to the TripleTrouble repos), HF_DATASET (team data repo), RCLONE_CONFIG (rclone.conf
# with a Google Drive remote named gdrive).
#
# Disk: the runner has one ~72 GB disk (/mnt is the same filesystem), about 52 GB free after clean-up. Docker's
# containerd image store keeps every layer twice (unpacked + compressed), which does not fit with 14 GB of weights,
# so the classic overlay2 store is used, and the archive is streamed to Drive instead of being written to disk.
name: Docker image

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the archive to Google Drive
        type: boolean
        default: true
  push:
    tags: ["docker-*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OUT_DIR: /home/runner/out   # small files only: MD5, size, link
      ARCHIVE: zac2026_TripleTrouble.tar.gz
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Use the classic overlay2 image store
        run: |
          sudo systemctl stop docker docker.socket
          conf=/etc/docker/daemon.json
          [ -s "$conf" ] || echo '{}' | sudo tee "$conf" >/dev/null
          sudo jq '. + {"features": ((.features // {}) + {"containerd-snapshotter": false})}' "$conf" \
            | sudo tee "$conf.new" >/dev/null && sudo mv "$conf.new" "$conf"
          sudo systemctl start docker
          docker info --format 'storage driver: {{.Driver}}, root: {{.DockerRootDir}}'
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch the data (team's private HF dataset)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ secrets.HF_DATASET }}
        run: |
          pip install --quiet huggingface_hub
          PYTHONPATH=src python -m lifemate.fetch_data --hf-repo "$HF_DATASET"
          ls data

      - name: Build the image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "$OUT_DIR"
          SAVE=0 bash scripts/docker_build.sh
          docker builder prune -af >/dev/null
          docker system df
          df -h /

      - name: Smoke test (CPU, offline)
        run: bash scripts/docker_smoke.sh "zac2026-tripletrouble:$(git rev-parse --short HEAD)" data/public_test

      - name: Stream the archive to Google Drive
        if: github.event_name == 'push' || inputs.upload
        env:
          RCLONE_CONF_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -o pipefail
          sudo apt-get install -y --no-install-recommends pigz >/dev/null
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF_TEXT" > ~/.config/rclone/rclone.conf
          tag="zac2026-tripletrouble:$(git rev-parse --short HEAD)"
          dest="gdrive:zaic2026/$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)"
          docker save "$tag" | pigz | rclone rcat "$dest/$ARCHIVE" --streaming-upload-cutoff 0 \
            --drive-chunk-size 256M --stats 60s --stats-one-line -v
          # the MD5 Drive computed on the stored file: exactly what the organisers download
          rclone md5sum "$dest/$ARCHIVE" | tee "$OUT_DIR/$ARCHIVE.md5"
          rclone size --json "$dest/$ARCHIVE" | jq -r '.bytes' > "$OUT_DIR/bytes.txt"
          rclone link "$dest/$ARCHIVE" > "$OUT_DIR/link.txt"
          echo "Drive folder: $dest"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Docker image $(git rev-parse --short HEAD)"
            echo
            if [ -f "$OUT_DIR/bytes.txt" ]; then echo "- size: $(numfmt --to=iec "$(cat "$OUT_DIR/bytes.txt")")"; fi
            if [ -f "$OUT_DIR/$ARCHIVE.md5" ]; then echo "- MD5: \`$(cut -d' ' -f1 "$OUT_DIR/$ARCHIVE.md5")\`"; fi
            if [ -f "$OUT_DIR/link.txt" ]; then echo "- Google Drive link: $(cat "$OUT_DIR/link.txt")"; fi
            echo
            echo "Portal: Test Solution -> paste the link and the MD5 -> Submit Test (1 run per day, until 15 Nov 23:59 GMT+7)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the data
        if: always()
        run: rm -rf data/train data/public_test
